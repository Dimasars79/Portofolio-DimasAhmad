<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Hexagon / Card Background -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Monogram DA -->
  <text x="50" y="62" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="1">DA</text>
  
  <!-- Tech Accent Dot -->
  <circle cx="76" cy="30" r="4" fill="#38BDF8"/>
</svg>